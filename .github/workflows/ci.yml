name: Build and Test

on:
  push:
    branches: -main
  pull_request:
    branches:
      - main
      - main-dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        #actions/setup-node@v4
        #with:
        #  node-version: 22.x
        #cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Lint the code
        run: npm run lint

      - name: Run tests (only on pull_request)
        if: github.event_name == 'pull_request'
        run: npm run test

      - name: Build project
        run: npm run build

      - name: Verify build
        run: |
          if [ -d ".next" ]; then
            echo "Build succeeded"
          else
            echo "Build failed"
            exit 1
          fi

      - name: Complete
        run: echo "Build and test completed successfully"
